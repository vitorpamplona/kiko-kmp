#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
# Apple targets build only on macOS; elsewhere skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.kiko
POM_ARTIFACT_ID=kiko
VERSION_NAME=0.1.0
# The web targets use no DOM API, so they don't pull kotlin-dom-api-compat onto every
# consumer's classpath: the library depends on the Kotlin stdlib alone.
kotlin.js.stdlib.dom.api.included=false
