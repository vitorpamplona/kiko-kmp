name: Create Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # The Apple tests run on macOS before anything publishes.
  test-apple:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/cache-konan

      - name: Check iOS and macOS
        run: ./gradlew checkApple

  # Apple klibs cross-compile on Linux; only Apple test binaries need a Mac.
  deploy:
    needs: test-apple
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/cache-konan

      # The task lists live in the root build.gradle.kts, shared with CI and the pre-push hook.
      - name: Check
        run: ./gradlew checkLinux checkWeb

      - name: Build (gradle)
        run: ./gradlew :kiko:assemble :kiko-player:assemble :kiko-compose:assemble

      # Tag v1.2.3 publishes version 1.2.3.
      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish
        # Every module that publishes (kiko, kiko-player, kiko-compose; not the demo).
        run: ./gradlew publishAllPublicationsToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true

  # The same publications on Nostr + Blossom, through Magpie's publishToNostr (the plugin version
  # is in libs.versions.toml, the relays in gradle.properties), beside the Maven Central job and
  # independent of it: Central's upload limit can fail one without holding back the other. It runs
  # the same checks first, uploads every file to the release key's Blossom servers (kind 10063)
  # and signs one release event (kind 3071) per published module, sent to the key's own relays
  # (its kind 10002 and nostr.json). The key never reaches CI: MAGPIE_BUNKER is a NIP-46 bunker
  # URI, so the signer approves each release (the job waits for it), and
  # vitorpamplona.com/.well-known/nostr.json must name the key as "releases" or Magpie refuses to
  # sign. A version already on Nostr fails the job: releases are immutable.
  nostr:
    needs: test-apple
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/cache-konan

      - name: Check
        run: ./gradlew checkLinux checkWeb

      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish to Nostr
        run: ./gradlew :kiko:publishToNostr :kiko-player:publishToNostr :kiko-compose:publishToNostr --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          MAGPIE_BUNKER: ${{ secrets.MAGPIE_BUNKER }}
